[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unifi-mcp-coolify"
version = "0.1.0"
description = "Read-only-first UniFi MCP server for Coolify, Hermes, and OpenClaw"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.13,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
unifi-mcp = "unifi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
