[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unifi-observer"
version = "0.1.0"
description = "Read-only-first UniFi Observer service for Coolify, Hermes, and OpenClaw"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.13,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
unifi-observer = "unifi_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_mcp", "scripts"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
