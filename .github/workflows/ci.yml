name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,dev]'
      - run: python -m pytest
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: bash -n install.sh scripts/setup.sh scripts/terminal-ui.sh
      - run: python -m build
      - run: docker compose config --quiet
